name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de bump semver (ignorado si VERSION aun no tiene tag — completa release pendiente)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: bump
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --force origin

          function Assert-Semver([string]$value) {
            if ($value -notmatch '^\d+\.\d+\.\d+$') {
              throw "Semver invalido: '$value'"
            }
            return [version]$value
          }

          function Tag-Exists([string]$tagName) {
            if (git tag -l $tagName) { return $true }
            $remote = git ls-remote --tags origin "refs/tags/$tagName"
            return -not [string]::IsNullOrWhiteSpace($remote)
          }

          $bump = "${{ inputs.bump }}"
          $fileVer = (Get-Content -Path VERSION -Raw).Trim()
          $null = Assert-Semver $fileVer
          $fileTag = "v$fileVer"

          # Release incompleto: VERSION ya bumpeada pero sin tag.
          if (-not (Tag-Exists $fileTag)) {
            $new = $fileVer
            $tag = $fileTag
            $mode = "finish-pending"
            Write-Host "VERSION $fileVer sin tag. Completando release $tag (bump ignorado)."
          }
          else {
            $base = Assert-Semver $fileVer
            foreach ($t in (git tag -l "v*.*.*")) {
              $tVer = $t.Substring(1)
              if ($tVer -notmatch '^\d+\.\d+\.\d+$') { continue }
              $tv = [version]$tVer
              if ($tv -gt $base) { $base = $tv }
            }

            switch ($bump) {
              "major" { $next = [version]::new($base.Major + 1, 0, 0) }
              "minor" { $next = [version]::new($base.Major, $base.Minor + 1, 0) }
              "patch" { $next = [version]::new($base.Major, $base.Minor, $base.Build + 1) }
              default { throw "bump desconocido: $bump" }
            }
            $new = "$($next.Major).$($next.Minor).$($next.Build)"
            while (Tag-Exists "v$new") {
              Write-Host "Tag v$new ocupado; auto patch++"
              $cur = [version]$new
              $new = "$($cur.Major).$($cur.Minor).$($cur.Build + 1)"
            }
            $tag = "v$new"
            $mode = "bump"
            Write-Host "Base $base (file=$fileVer) -> $new ($bump)"
          }

          Set-Content -Path VERSION -Value "$new`n" -NoNewline
          $init = Get-Content -Path app/__init__.py -Raw
          if ($init -notmatch '__version__\s*=') {
            throw "No se encontro __version__ en app/__init__.py"
          }
          $updated = [regex]::Replace($init, '__version__\s*=\s*["''][^"'']*["'']', "__version__ = `"$new`"")
          Set-Content -Path app/__init__.py -Value $updated -NoNewline

          "version=$new" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Prepare Argos en-es packages
        shell: pwsh
        run: python scripts/prepare_argos_packages.py

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm scripts/EstiloKaio.spec

      - name: Zip executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.bump.outputs.version }}"
          $exe = "dist/EstiloKaio.exe"
          if (-not (Test-Path $exe)) {
            throw "No se genero $exe"
          }
          $zip = "EstiloKaio-v$version-windows.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Commit, tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.bump.outputs.tag }}"
          $version = "${{ steps.bump.outputs.version }}"
          $zip = "EstiloKaio-v$version-windows.zip"
          if (-not (Test-Path $zip)) {
            throw "Falta $zip"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "chore: release $tag"
            git push origin HEAD:main
          }
          else {
            Write-Host "Sin cambios de version que commitear; se tagea HEAD actual."
          }

          if (git tag -l $tag) {
            throw "El tag $tag aparecio durante el job; abortando."
          }
          git tag $tag
          git push origin $tag

          $notes = @"
          Windows x64 — ejecutable onefile ``EstiloKaio.exe`` (sin Python).

          Argos en-es va en el zip (traducción offline). Gemma / Ollama no: configurarlos aparte si los usas.
          "@
          gh release create $tag $zip --title "Estilo Kaio $tag" --notes $notes
